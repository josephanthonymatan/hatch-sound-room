name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check:public
      - name: Scan complete Git history for credentials
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=--all --redact=100 --no-banner
      - run: npm test
      - run: npm run build
      - name: Build self-hosted container
        run: docker build -f cloud/Dockerfile -t hatch-sound-room:ci .
